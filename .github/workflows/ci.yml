# CI: regression tests and example builds on every PR and on merge to master.
# The jobs "test" and "examples (*)" are meant to be required status checks.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # l3build regression tests across pdfTeX, XeTeX and LuaTeX.
  test:
    name: test
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v7
      # No --halt-on-failure: every test runs, so the report is complete.
      - name: l3build check
        run: l3build check --show-log-on-error
      - name: JUnit report
        if: ${{ !cancelled() }}
        run: scripts/junit.sh > build/test/junit.xml
      - name: Upload test results and diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            build/test/junit.xml
            build/test/*.diff
          if-no-files-found: ignore

  # Test Analytics: send the JUnit report to Codecov. A separate job keeps
  # the uploader out of the TeX Live container.
  test-results:
    name: test results
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: test-results
          path: build/test
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/test/junit.xml
          report_type: test_results

  # Compile every example in strict mode, one job per engine.
  examples:
    name: examples (${{ matrix.engine }})
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    strategy:
      fail-fast: false
      matrix:
        engine: [pdf, xe, lua]
    steps:
      - uses: actions/checkout@v7
      - name: Build examples
        run: scripts/build.sh -s -e ${{ matrix.engine }}
      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-${{ matrix.engine }}
          path: |
            build/examples/${{ matrix.engine }}/*.pdf
            build/examples/${{ matrix.engine }}/*.log
          if-no-files-found: error
