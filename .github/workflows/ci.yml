# CI: regression tests and example builds on every PR and on merge to master.
# The jobs "test" and "examples (*)" are meant to be required status checks.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # l3build regression tests across pdfTeX, XeTeX and LuaTeX.
  test:
    name: test
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v7
      # No --halt-on-failure: every test runs, so the report is complete.
      - name: l3build check
        run: l3build check --show-log-on-error
      - name: JUnit report
        if: ${{ !cancelled() }}
        run: scripts/junit.sh > build/test/junit.xml
      - name: Upload test results and diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            build/test/junit.xml
            build/test/*.diff
          if-no-files-found: ignore

  # Test Analytics: send the JUnit report to Codecov. A separate job keeps
  # the uploader out of the TeX Live container.
  test-results:
    name: test results
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: test-results
          path: build/test
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/test/junit.xml
          report_type: test_results

  # Accessibility and text extraction of the built examples: WCAG contrast
  # of theme colours, veraPDF (PDF/UA-1 and UA-2) on the tagged examples,
  # and the exact contact line of every showcase as text extraction (and so
  # applicant-tracking systems) reads it.
  pdf-checks:
    name: pdf checks
    needs: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: examples-*
          path: build/examples
      # Artifacts land in build/examples/examples-<engine>; rename to <engine>.
      - name: Arrange PDFs by engine
        run: for d in build/examples/examples-*; do mv "$d" "build/examples/${d##*/examples-}"; done
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Contrast of theme colours
        run: scripts/check-contrast.py
      - name: Check PDFs
        env:
          # veraPDF CLI v1.30.4, pinned by digest.
          VERAPDF: docker run --rm -v ${{ github.workspace }}:/data verapdf/cli@sha256:f085855d442ad415e79fabbabcdd1803c2db4ee097cd5b94506c95ecdcfa1728
        run: scripts/check-pdf.sh

  # Compile every example in strict mode, one job per engine.
  examples:
    name: examples (${{ matrix.engine }})
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    strategy:
      fail-fast: false
      matrix:
        engine: [pdf, xe, lua]
    steps:
      - uses: actions/checkout@v7
      - name: Build examples
        run: scripts/build.sh -s -e ${{ matrix.engine }}
      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-${{ matrix.engine }}
          path: |
            build/examples/${{ matrix.engine }}/*.pdf
            build/examples/${{ matrix.engine }}/*.log
          if-no-files-found: error
