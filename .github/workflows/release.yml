# Release: on a version tag, test, package and publish a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      # The tag must match the version declared in vitae.cls (set by `l3build tag`).
      - name: Check version
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "{vitae}{[0-9-]*}{$v}" src/vitae.cls \
            || { echo "tag $GITHUB_REF_NAME does not match src/vitae.cls"; exit 1; }
      - name: Test
        run: l3build check --halt-on-failure
      - name: Package
        run: |
          l3build ctan
          scripts/build.sh -s -e pdf
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/distrib/ctan/vitae-ctan.zip
            build/examples/pdf/*.pdf
